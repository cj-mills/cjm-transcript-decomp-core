# PUBLIC capabilities yaml — PROJECTED from capabilities_test.yaml by `cjm-ctl derive-public-capabilities` (ruling 8299fb9d: one channel, PyPI specs with
# floors, env_file = the capability repo's raw environment.yml). Regenerate after every
# publish window; the dev yaml with checkout paths stays the --capabilities override.
capabilities:
- name: sys-mon-nvidia
  env_name: test-sys-mon
  env_file: https://raw.githubusercontent.com/cj-mills/cjm-capability-monitor-nvidia/main/environment.yml
  package: cjm-capability-monitor-nvidia>=0.0.26
  interface_libs:
  - cjm-capability-primitives>=0.0.13
- name: silero-vad
  env_name: test-silero-vad
  env_file: https://raw.githubusercontent.com/cj-mills/cjm-capability-silero-vad/main/environment.yml
  package: cjm-capability-silero-vad>=0.0.29
  interface_libs:
  - cjm-capability-primitives>=0.0.13
  adapters:
  - lib: cjm-vad-adapter-interface>=0.0.11
    impl: cjm_vad_adapter_interface.generic:GenericVADAdapter
- name: pysbd
  env_name: test-pysbd
  env_file: https://raw.githubusercontent.com/cj-mills/cjm-capability-pysbd/main/environment.yml
  package: cjm-capability-pysbd>=0.0.1
  interface_libs:
  - cjm-capability-primitives>=0.0.13
  adapters:
  - lib: cjm-sentence-segmentation-adapter-interface>=0.0.2
    impl: cjm_sentence_segmentation_adapter_interface.generic:GenericSentenceSegmentationAdapter
- name: qwen3-forced-aligner
  env_name: test-qwen3-fa
  env_file: https://raw.githubusercontent.com/cj-mills/cjm-capability-qwen3-forced-aligner/main/environment.yml
